<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="webinar-transcriber {{version}}">
<meta name="color-scheme" content="light dark">
<title>{{title}}</title>
<style>
:root {
  --bg: #f7f7fb;
  --bg-elevated: #ffffff;
  --bg-sunken: #eeeef5;
  --text: #16161d;
  --text-muted: #5d5d6e;
  --border: #e2e2ec;
  --accent: #5b4bdb;
  --accent-soft: #ecebfd;
  --accent-text: #4433c4;
  --notes-bg: #f3f1ff;
  --notes-border: #d9d4ff;
  --shadow: 0 1px 2px rgb(20 20 40 / 0.04), 0 8px 24px rgb(20 20 40 / 0.06);
  --glow: radial-gradient(1200px 400px at 15% -10%, rgb(91 75 219 / 0.12), transparent 70%),
    radial-gradient(900px 360px at 95% 0%, rgb(14 165 233 / 0.10), transparent 70%);
  --spk-0: #2563eb; --spk-1: #db2777; --spk-2: #059669; --spk-3: #d97706;
  --spk-4: #7c3aed; --spk-5: #0891b2; --spk-6: #dc2626; --spk-7: #65a30d;
  --radius: 16px;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
    "Noto Sans", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0e14; --bg-elevated: #17171f; --bg-sunken: #1f1f29; --text: #ececf3;
    --text-muted: #a0a0b4; --border: #2a2a37; --accent: #9d92ff; --accent-soft: #25223f;
    --accent-text: #b8b0ff; --notes-bg: #1c1a2e; --notes-border: #353060;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px rgb(0 0 0 / 0.25);
    --glow: radial-gradient(1200px 400px at 15% -10%, rgb(124 108 255 / 0.18), transparent 70%),
      radial-gradient(900px 360px at 95% 0%, rgb(14 165 233 / 0.12), transparent 70%);
    --spk-0: #60a5fa; --spk-1: #f472b6; --spk-2: #34d399; --spk-3: #fbbf24;
    --spk-4: #a78bfa; --spk-5: #22d3ee; --spk-6: #f87171; --spk-7: #a3e635;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0e14; --bg-elevated: #17171f; --bg-sunken: #1f1f29; --text: #ececf3;
  --text-muted: #a0a0b4; --border: #2a2a37; --accent: #9d92ff; --accent-soft: #25223f;
  --accent-text: #b8b0ff; --notes-bg: #1c1a2e; --notes-border: #353060;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px rgb(0 0 0 / 0.25);
  --glow: radial-gradient(1200px 400px at 15% -10%, rgb(124 108 255 / 0.18), transparent 70%),
    radial-gradient(900px 360px at 95% 0%, rgb(14 165 233 / 0.12), transparent 70%);
  --spk-0: #60a5fa; --spk-1: #f472b6; --spk-2: #34d399; --spk-3: #fbbf24;
  --spk-4: #a78bfa; --spk-5: #22d3ee; --spk-6: #f87171; --spk-7: #a3e635;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--glow), var(--bg); background-repeat: no-repeat; color: var(--text);
  font: 16px/1.65 var(--font); -webkit-font-smoothing: antialiased;
}
a { color: var(--accent-text); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }

.topbar {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px;
  height: 60px; padding: 0 clamp(16px, 4vw, 32px);
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter: saturate(160%) blur(14px); -webkit-backdrop-filter: saturate(160%) blur(14px);
  border-bottom: 1px solid var(--border);
}
.topbar-title {
  flex: 1; min-width: 0; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; opacity: 0; transition: opacity 0.2s;
}
.topbar.scrolled .topbar-title { opacity: 1; }
.progress {
  position: absolute; left: 0; bottom: -1px; height: 2px; width: 100%; transform-origin: 0 50%;
  transform: scaleX(0); background: linear-gradient(90deg, var(--accent), #0ea5e9);
}
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px;
  border: 1px solid var(--border); border-radius: 999px; background: var(--bg-elevated);
  cursor: pointer; font-size: 14px; font-weight: 500; transition: border-color 0.15s, background 0.15s;
}
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .deck button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn-primary { color: #0e0e14; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-primary { color: #0e0e14; } }
.btn-icon { width: 36px; padding: 0; justify-content: center; }
.btn svg { width: 16px; height: 16px; }
kbd {
  font: 11px var(--mono); padding: 1px 5px; border-radius: 4px; border: 1px solid currentColor;
  opacity: 0.7;
}

.layout {
  display: grid; gap: 48px; max-width: 1240px; margin: 0 auto;
  padding: 40px clamp(16px, 4vw, 32px) 96px;
}
.layout.has-toc { grid-template-columns: 240px minmax(0, 1fr); }
.toc { position: sticky; top: 92px; max-height: calc(100vh - 120px); overflow: auto; }
.toc h2 {
  margin: 0 0 12px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-muted);
}
.toc ol { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--border); }
.toc a {
  display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 6px 12px; margin-left: -1px;
  border-left: 2px solid transparent; color: var(--text-muted); font-size: 14px; line-height: 1.4;
}
.toc a:hover { color: var(--text); text-decoration: none; }
.toc a[aria-current="true"] { color: var(--accent-text); border-left-color: var(--accent); }
.toc-time { font: 12px/1.6 var(--mono); opacity: 0.8; }

.hero { margin-bottom: 40px; }
.eyebrow {
  margin: 0 0 8px; color: var(--accent-text); font-size: 13px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase;
}
.hero h1 {
  margin: 0 0 20px; font-size: clamp(30px, 5vw, 48px); line-height: 1.1; letter-spacing: -0.02em;
  text-wrap: balance;
}
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.meta li {
  padding: 4px 12px; border: 1px solid var(--border); border-radius: 999px;
  background: var(--bg-elevated); color: var(--text-muted); font-size: 13px;
  overflow-wrap: anywhere;
}

.overview { display: grid; gap: 20px; margin-bottom: 48px; }
.card {
  padding: 24px 28px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-elevated); box-shadow: var(--shadow);
}
.card h2 { margin: 0 0 12px; font-size: 18px; }
.summary-list, .action-list { margin: 0; padding: 0; list-style: none; }
.summary-list li, .action-list li { position: relative; padding: 6px 0 6px 28px; }
.summary-list li::before {
  content: ""; position: absolute; left: 6px; top: 16px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--accent);
}
.action-list li::before {
  content: ""; position: absolute; left: 0; top: 10px; width: 16px; height: 16px;
  border: 1.5px solid var(--accent); border-radius: 5px;
}

.sections { display: grid; gap: 56px; }
.section-head { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 20px; }
.section-index {
  flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px;
  background: var(--accent-soft); color: var(--accent-text); font: 600 14px var(--mono);
}
.section-head h2 {
  margin: 0; font-size: clamp(20px, 3vw, 26px); line-height: 1.25; letter-spacing: -0.01em;
  text-wrap: balance;
}
.timecode { font: 13px var(--mono); color: var(--text-muted); }
.frame {
  margin: 0 0 20px; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg-sunken); box-shadow: var(--shadow);
}
.frame img { display: block; width: 100%; height: auto; cursor: zoom-in; }
.label {
  margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text-muted);
}
.notes {
  margin-bottom: 24px; padding: 18px 22px; border: 1px solid var(--notes-border);
  border-radius: var(--radius); background: var(--notes-bg);
}
.notes .label { color: var(--accent-text); }
.notes-body > :first-child, .transcript-body > :first-child { margin-top: 0; }
.notes-body > :last-child, .transcript-body > :last-child { margin-bottom: 0; }
.notes-body ul, .notes-body ol, .transcript-body ul, .transcript-body ol { padding-left: 22px; }
.transcript-body p { margin: 0 0 14px; }
.turn { padding-left: 0; }
.speaker {
  display: inline-block; margin-right: 6px; padding: 0 8px; border-radius: 6px;
  font: 600 12px/20px var(--mono); vertical-align: 1px; color: var(--spk);
  background: color-mix(in srgb, var(--spk) 14%, transparent);
}
.spk-0 { --spk: var(--spk-0); } .spk-1 { --spk: var(--spk-1); } .spk-2 { --spk: var(--spk-2); }
.spk-3 { --spk: var(--spk-3); } .spk-4 { --spk: var(--spk-4); } .spk-5 { --spk: var(--spk-5); }
.spk-6 { --spk: var(--spk-6); } .spk-7 { --spk: var(--spk-7); }
.footer {
  margin-top: 72px; padding-top: 20px; border-top: 1px solid var(--border);
  color: var(--text-muted); font-size: 13px;
}

.lightbox {
  max-width: 96vw; max-height: 96vh; padding: 0; border: 0; border-radius: 12px;
  background: transparent; cursor: zoom-out;
}
.lightbox::backdrop { background: rgb(0 0 0 / 0.82); }
.lightbox img { display: block; max-width: 96vw; max-height: 96vh; object-fit: contain; }

/* Presentation mode */
.deck {
  position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
  background: var(--glow), var(--bg); background-repeat: no-repeat; color: var(--text);
}
.deck[hidden] { display: none; }
.deck:focus { outline: none; }
body.presenting { overflow: hidden; }
.deck-stage { flex: 1; min-height: 0; position: relative; overflow: hidden; }
.slide {
  position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center;
  gap: 2.4vh; padding: 5vh 6vw; animation: slide-in 0.35s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.slide.back { animation-name: slide-back; }
@keyframes slide-in { from { opacity: 0; transform: translateX(28px); } }
@keyframes slide-back { from { opacity: 0; transform: translateX(-28px); } }
@media (prefers-reduced-motion: reduce) { .slide { animation: none; } html { scroll-behavior: auto; } }
.slide-kicker {
  margin: 0; font: 600 clamp(13px, 1.6vh, 18px) var(--mono); color: var(--accent-text);
  letter-spacing: 0.04em;
}
.slide h1 {
  margin: 0; max-width: 24ch; font-size: clamp(36px, 7.5vh, 88px); line-height: 1.05;
  letter-spacing: -0.03em; text-wrap: balance;
}
.slide h2 {
  margin: 0; font-size: clamp(26px, 5vh, 56px); line-height: 1.12; letter-spacing: -0.02em;
  text-wrap: balance;
}
.slide .meta li { font-size: clamp(13px, 1.7vh, 18px); }
.slide-body {
  flex: 0 1 auto; min-height: 0; display: grid; gap: 3vw; align-items: start;
  font-size: clamp(16px, 2.3vh, 26px); line-height: 1.5;
}
.slide-body.split { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); align-items: center; }
.slide-body img {
  display: block; width: auto; height: auto; max-width: 100%; max-height: 66vh;
  justify-self: center; border-radius: 14px;
  border: 1px solid var(--border); background: var(--bg-sunken); box-shadow: var(--shadow);
}
.slide-text { min-height: 0; max-height: 66vh; overflow: auto; }
.slide-body:not(.split) .slide-text { max-width: 60ch; }
.slide-text.excerpt {
  mask-image: linear-gradient(180deg, #000 70%, transparent);
  -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent);
  overflow: hidden;
}
.slide-text p { margin: 0 0 0.7em; }
.slide-text ul, .slide-text ol { margin: 0; padding-left: 1.2em; }
.slide-text li { margin: 0 0 0.5em; }
.slide .summary-list li, .slide .action-list li { padding: 0.35em 0 0.35em 1.8em; }
.slide .summary-list li::before { top: 0.95em; width: 0.4em; height: 0.4em; left: 0.4em; }
.slide .action-list li::before { top: 0.6em; width: 0.9em; height: 0.9em; }
.deck-bar {
  display: flex; align-items: center; gap: 10px; padding: 10px clamp(12px, 3vw, 24px);
  border-top: 1px solid var(--border);
  background: color-mix(in srgb, var(--bg) 85%, transparent);
}
.deck-bar button {
  display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--border);
  border-radius: 10px; background: var(--bg-elevated); cursor: pointer;
}
.deck-bar button:hover { border-color: var(--accent); }
.deck-bar svg { width: 16px; height: 16px; }
.deck-count { min-width: 64px; text-align: center; font: 13px var(--mono); color: var(--text-muted); }
.deck-track { flex: 1; height: 4px; border-radius: 999px; background: var(--bg-sunken); overflow: hidden; }
.deck-fill {
  display: block; height: 100%; width: 0; border-radius: inherit;
  background: linear-gradient(90deg, var(--accent), #0ea5e9); transition: width 0.3s;
}
.deck-hint { color: var(--text-muted); font-size: 12px; }

@media (max-width: 960px) {
  .layout.has-toc { grid-template-columns: minmax(0, 1fr); gap: 0; }
  /* Flatten main so the contents can sit between the title and the overview */
  .layout.has-toc > main { display: contents; }
  .hero { order: 1; }
  .toc { order: 2; position: static; max-height: none; margin-bottom: 40px; }
  .overview { order: 3; }
  .sections { order: 4; }
  .footer { order: 5; }
  .slide-body.split { grid-template-columns: minmax(0, 1fr); }
  .slide-body img { max-height: 40vh; }
  .slide-text { max-height: 30vh; }
  .deck-hint, .btn .btn-label-long { display: none; }
}
@media print {
  body { background: #fff; color: #000; }
  .topbar, .toc, .deck, .lightbox { display: none !important; }
  .layout, .layout.has-toc { display: block; padding: 0; }
  .card, .frame { box-shadow: none; }
  .frame, .notes { break-inside: avoid; }
  .section { break-before: page; }
}
</style>
</head>
<body>
<header class="topbar" id="topbar">
  <div class="topbar-title">{{title}}</div>
  <button class="btn btn-icon" type="button" id="theme-toggle" aria-label="Toggle light or dark theme" title="Toggle theme">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <button class="btn btn-primary" type="button" id="present" title="Present as slides (P)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    Present <kbd class="btn-label-long">P</kbd>
  </button>
  <span class="progress" id="progress"></span>
</header>
<div class="layout {{layout_class}}">
{{toc}}
<main>
<header class="hero" id="top">
  <p class="eyebrow">Webinar report</p>
  <h1>{{title}}</h1>
  <ul class="meta">{{meta}}</ul>
</header>
{{overview}}
<div class="sections">
{{sections}}
</div>
<footer class="footer">Generated locally by webinar-transcriber {{version}}.</footer>
</main>
</div>
<dialog class="lightbox" id="lightbox" aria-label="Enlarged frame"><img alt=""></dialog>
<div class="deck" id="deck" hidden tabindex="-1" role="region" aria-roledescription="slide deck" aria-label="Presentation">
  <div class="deck-stage" id="deck-stage" aria-live="polite"></div>
  <nav class="deck-bar" aria-label="Slide controls">
    <button type="button" data-deck="prev" aria-label="Previous slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <span class="deck-count" id="deck-count"></span>
    <button type="button" data-deck="next" aria-label="Next slide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    <span class="deck-track"><span class="deck-fill" id="deck-fill"></span></span>
    <span class="deck-hint"><kbd>←</kbd> <kbd>→</kbd> navigate · <kbd>F</kbd> fullscreen · <kbd>Esc</kbd> exit</span>
    <button type="button" data-deck="fullscreen" aria-label="Toggle fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
    <button type="button" data-deck="exit" aria-label="Exit presentation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </nav>
</div>
<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var THEME_KEY = "webinar-transcriber-theme";

  function readTheme() {
    try { return localStorage.getItem(THEME_KEY); } catch (ex) { return null; }
  }
  function applyTheme(theme) {
    if (theme === "light" || theme === "dark") root.setAttribute("data-theme", theme);
  }
  applyTheme(readTheme());
  document.getElementById("theme-toggle").addEventListener("click", function () {
    var current = root.getAttribute("data-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    var next = current === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (ex) { /* storage is optional */ }
  });

  // Reading progress, the compact title, and the contents entry for the section being read
  var topbar = document.getElementById("topbar");
  var progress = document.getElementById("progress");
  var sections = Array.prototype.slice.call(document.querySelectorAll(".section"));
  var tocLinks = Array.prototype.slice.call(document.querySelectorAll(".toc a"));
  function onScroll() {
    var max = document.documentElement.scrollHeight - innerHeight;
    progress.style.transform = "scaleX(" + (max > 0 ? scrollY / max : 0) + ")";
    topbar.classList.toggle("scrolled", scrollY > 160);
    if (!tocLinks.length) return;
    // The reading section is the last one whose top has passed under the bar
    var reading = 0;
    sections.forEach(function (section, i) {
      if (section.getBoundingClientRect().top <= 120) reading = i;
    });
    tocLinks.forEach(function (link, i) {
      link.setAttribute("aria-current", i === reading ? "true" : "false");
    });
  }
  addEventListener("scroll", onScroll, { passive: true });
  onScroll();

  // Enlarge frames in place
  var lightbox = document.getElementById("lightbox");
  var lightboxImage = lightbox.querySelector("img");
  document.addEventListener("click", function (event) {
    var image = event.target.closest(".frame img");
    if (!image || !lightbox.showModal) return;
    lightboxImage.src = image.src;
    lightboxImage.alt = image.alt;
    lightbox.showModal();
  });
  lightbox.addEventListener("click", function () { lightbox.close(); });

  // Presentation mode builds its slides from the report markup on first use
  var deck = document.getElementById("deck");
  var stage = document.getElementById("deck-stage");
  var count = document.getElementById("deck-count");
  var fill = document.getElementById("deck-fill");
  var slides = null;
  var current = 0;

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text) node.textContent = text;
    return node;
  }

  function buildSlides() {
    var built = [];
    var title = el("div", "slide");
    title.appendChild(el("p", "slide-kicker", "Webinar report"));
    title.appendChild(el("h1", "", document.querySelector(".hero h1").textContent));
    title.appendChild(document.querySelector(".hero .meta").cloneNode(true));
    built.push({ node: title, anchor: "top" });

    document.querySelectorAll(".overview .card").forEach(function (card) {
      var slide = el("div", "slide");
      slide.appendChild(el("h2", "", card.getAttribute("data-slide")));
      var body = el("div", "slide-body");
      var text = el("div", "slide-text");
      text.appendChild(card.querySelector("ul").cloneNode(true));
      body.appendChild(text);
      slide.appendChild(body);
      built.push({ node: slide, anchor: card.id });
    });

    document.querySelectorAll(".section").forEach(function (section) {
      var slide = el("div", "slide");
      var index = section.querySelector(".section-index").textContent;
      var time = section.querySelector(".timecode").textContent;
      slide.appendChild(el("p", "slide-kicker", index + "  ·  " + time));
      slide.appendChild(el("h2", "", section.querySelector("h2").textContent));
      var image = section.querySelector(".frame img");
      var notes = section.querySelector(".notes-body");
      var transcript = section.querySelector(".transcript-body");
      var source = notes || transcript;
      var body = el("div", "slide-body" + (image && source ? " split" : ""));
      if (image) {
        var copy = image.cloneNode(true);
        copy.removeAttribute("loading");
        body.appendChild(copy);
      }
      if (source) {
        var text = el("div", "slide-text" + (notes ? "" : " excerpt"));
        Array.prototype.slice.call(source.children, 0, notes ? undefined : 4).forEach(function (child) {
          text.appendChild(child.cloneNode(true));
        });
        body.appendChild(text);
      }
      slide.appendChild(body);
      built.push({ node: slide, anchor: section.id });
    });
    return built;
  }

  function show(index, backwards) {
    current = Math.max(0, Math.min(slides.length - 1, index));
    var node = slides[current].node;
    node.classList.toggle("back", Boolean(backwards));
    stage.replaceChildren(node);
    count.textContent = (current + 1) + " / " + slides.length;
    fill.style.width = ((current + 1) / slides.length * 100) + "%";
    history.replaceState(null, "", "#slides-" + (current + 1));
  }

  function openDeck(index) {
    if (!slides) slides = buildSlides();
    deck.hidden = false;
    document.body.classList.add("presenting");
    show(index || 0);
    deck.focus({ preventScroll: true });
  }

  function closeDeck() {
    if (document.fullscreenElement) document.exitFullscreen();
    deck.hidden = true;
    document.body.classList.remove("presenting");
    var anchor = slides[current].anchor;
    history.replaceState(null, "", "#" + anchor);
    var target = document.getElementById(anchor);
    if (target) target.scrollIntoView({ behavior: "instant" });
  }

  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (deck.requestFullscreen) deck.requestFullscreen();
  }

  var actions = {
    prev: function () { show(current - 1, true); },
    next: function () { show(current + 1); },
    exit: closeDeck,
    fullscreen: toggleFullscreen
  };
  deck.addEventListener("click", function (event) {
    var button = event.target.closest("[data-deck]");
    if (button) actions[button.getAttribute("data-deck")]();
  });
  document.getElementById("present").addEventListener("click", function () {
    var reading = document.querySelector(".toc a[aria-current=true]");
    var start = 0;
    if (reading) {
      if (!slides) slides = buildSlides();
      var id = reading.getAttribute("href").slice(1);
      slides.forEach(function (slide, i) { if (slide.anchor === id) start = i; });
    }
    openDeck(start);
  });

  document.addEventListener("keydown", function (event) {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (deck.hidden) {
      if ((event.key === "p" || event.key === "P") && !event.target.closest("input, textarea")) {
        event.preventDefault();
        openDeck(0);
      }
      return;
    }
    var key = event.key;
    if (key === "ArrowRight" || key === "PageDown" || key === " " || key === "Enter" || key === "j") actions.next();
    else if (key === "ArrowLeft" || key === "PageUp" || key === "Backspace" || key === "k") actions.prev();
    else if (key === "Home") show(0, true);
    else if (key === "End") show(slides.length - 1);
    else if (key === "f" || key === "F") toggleFullscreen();
    else if (key === "Escape" && !document.fullscreenElement) closeDeck();
    else return;
    event.preventDefault();
  });

  var touchX = null;
  stage.addEventListener("pointerdown", function (event) { touchX = event.clientX; });
  stage.addEventListener("pointerup", function (event) {
    if (touchX === null) return;
    var dx = event.clientX - touchX;
    touchX = null;
    if (Math.abs(dx) > 50) (dx < 0 ? actions.next : actions.prev)();
  });

  function openFromHash() {
    var match = /^#slides(?:-(\d+))?$/.exec(location.hash);
    if (match && deck.hidden) openDeck(match[1] ? Number(match[1]) - 1 : 0);
  }
  addEventListener("hashchange", openFromHash);
  openFromHash();
})();
</script>
</body>
</html>
